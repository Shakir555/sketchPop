<!DOCTYPE html>
<html>
<head>
    <title>MiniPaint</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
        #toolbar { background: #eee; padding: 10px; }
        #canvas { border: 1px solid black; cursor: crosshair; }
        .color-btn, .tool-btn { padding: 5px 10px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="toolbar">
        <input type="color" id="colorPicker" value="#000000">
        <input type="range" id="sizePicker" min="1" max="20" value="3">
        <button class="tool-btn" onclick="setTool('draw')">🖊️ Draw</button>
        <button class="tool-btn" onclick="setTool('erase')">🧼 Erase</button>
        <button class="tool-btn" onclick="clearCanvas()">🧹 Clear</button>
        <button class="tool-btn" onclick="saveImage()">💾 Save</button>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");
        let drawing = false;
        let tool = "draw";

        canvas.addEventListener("mousedown", () => drawing = true);
        canvas.addEventListener("mouseup", () => {
            drawing = false;
            ctx.beginPath(); // prevent continuous lines
        });
        canvas.addEventListener("mouseout", () => {
            drawing = false;
            ctx.beginPath();
        });

        canvas.addEventListener("mousemove", draw);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = document.getElementById("sizePicker").value;
            ctx.lineCap = "round";
            ctx.strokeStyle = tool === "erase" ? "#ffffff" : document.getElementById("colorPicker").value;
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function setTool(selectedTool) {
            tool = selectedTool;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
        }

        function saveImage() {
            const dataURL = canvas.toDataURL("image/png");
            if (backend && backend.saveImage) {
                backend.saveImage(dataURL);
                alert("Image saved to your home folder as miniPaint_saved.png!");
            } else {
                alert("Backend not ready!");
            }
        }

        let backend;
        new QWebChannel(qt.webChannelTransport, function(channel) {
            backend = channel.objects.backend;
        });
    </script>
</body>
</html>
